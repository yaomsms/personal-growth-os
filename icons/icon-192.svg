<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- 背景：浅色系圆角方形 -->
  <rect width="192" height="192" rx="38" ry="38" fill="#f8f5f0"/>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7cb342"/>
      <stop offset="100%" stop-color="#558b2f"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#6d4c41"/>
    </linearGradient>
  </defs>
  
  <!-- 嫩芽/叶子图标 -->
  <g transform="translate(96, 100)">
    <!-- 茎 -->
    <path d="M0 40 Q0 20 0 0" stroke="url(#stemGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- 左叶子 -->
    <path d="M-2 5 Q-35 -10 -30 -40 Q-10 -35 0 -15 Z" fill="url(#leafGrad)"/>
    
    <!-- 右叶子 -->
    <path d="M2 5 Q35 -10 30 -40 Q10 -35 0 -15 Z" fill="url(#leafGrad)"/>
    
    <!-- 顶部小芽 -->
    <ellipse cx="0" cy="-38" rx="8" ry="12" fill="#7cb342"/>
  </g>
  
  <!-- 底部文字 -->
  <text x="96" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#5d4037">成长OS</text>
</svg>
